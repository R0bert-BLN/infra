x-zitadel-image: &zitadel-image ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:-v4.19.4}

x-zitadel-database: &zitadel-database
  ZITADEL_DATABASE_POSTGRES_HOST: postgres
  ZITADEL_DATABASE_POSTGRES_PORT: 5432
  ZITADEL_DATABASE_POSTGRES_DATABASE: ${ZITADEL_DB_NAME:-zitadel}
  ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DB_USER:-zitadel}
  ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD:?set ZITADEL_DB_PASSWORD in .env}
  ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable

x-zitadel-external: &zitadel-external
  ZITADEL_EXTERNALDOMAIN: auth.${DOMAIN:?set DOMAIN in .env}
  ZITADEL_EXTERNALPORT: ${PUBLIC_PORT:?set PUBLIC_PORT in .env}
  ZITADEL_EXTERNALSECURE: ${PUBLIC_SECURE:?set PUBLIC_SECURE in .env}

services:
  zitadel-init:
    image: *zitadel-image
    profiles: [setup]
    command: init
    restart: "no"
    environment:
      <<: *zitadel-database
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_SUPERUSER:?set POSTGRES_SUPERUSER in .env}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      ZITADEL_DATABASE_POSTGRES_ADMIN_EXISTINGDATABASE: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  zitadel-setup:
    image: *zitadel-image
    profiles: [setup]
    command: setup --masterkeyFromEnv
    restart: "no"
    user: "0"
    environment:
      <<: [*zitadel-database, *zitadel-external]
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?set ZITADEL_MASTERKEY in .env}
      ZITADEL_FIRSTINSTANCE_ORG_NAME: ${ZITADEL_ORG_NAME:-ZITADEL}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME:?set ZITADEL_ADMIN_USERNAME in .env}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?set ZITADEL_ADMIN_PASSWORD in .env}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: true
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Login client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: true
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: ${PUBLIC_SCHEME:?set PUBLIC_SCHEME in .env}://auth.${DOMAIN:?set DOMAIN in .env}/ui/v2/login/
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap
    networks: [data]
    depends_on:
      zitadel-init:
        condition: service_completed_successfully

  zitadel-api:
    image: *zitadel-image
    command: start --masterkeyFromEnv
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.zitadel-api.entrypoints=web
      - traefik.http.routers.zitadel-api.rule=Host(`auth.${DOMAIN:?set DOMAIN in .env}`)
      - traefik.http.routers.zitadel-api.priority=1
      - traefik.http.routers.zitadel-api.middlewares=zitadel-host,public@file
      - traefik.http.middlewares.zitadel-host.headers.customrequestheaders.Host=auth.${DOMAIN}
      - traefik.http.middlewares.zitadel-host.headers.customrequestheaders.X-Forwarded-Host=auth.${DOMAIN}
      - traefik.http.services.zitadel-api.loadbalancer.server.port=8080
      - traefik.http.services.zitadel-api.loadbalancer.server.scheme=h2c
    environment:
      <<: [*zitadel-database, *zitadel-external]
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?set ZITADEL_MASTERKEY in .env}
      ZITADEL_TLS_ENABLED: false
      ZITADEL_OIDC_DEFAULTLOGINURLV2: ${PUBLIC_SCHEME}://auth.${DOMAIN}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: ${PUBLIC_SCHEME}://auth.${DOMAIN}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: ${PUBLIC_SCHEME}://auth.${DOMAIN}/ui/v2/login/login?samlRequest=
    networks: [edge, data]
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
          condition: service_healthy
      zitadel-setup:
        condition: service_completed_successfully
        required: false

  zitadel-ui:
    image: ghcr.io/zitadel/zitadel-login:${ZITADEL_VERSION:-v4.19.4}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.zitadel-ui.entrypoints=web
      - traefik.http.routers.zitadel-ui.rule=Host(`auth.${DOMAIN}`) && PathPrefix(`/ui/v2/login`)
      - traefik.http.routers.zitadel-ui.priority=10
      - traefik.http.routers.zitadel-ui.middlewares=public@file
      - traefik.http.routers.zitadel-ui.service=zitadel-ui
      - traefik.http.middlewares.zitadel-root.replacepath.path=/ui/v2/login/
      - traefik.http.routers.zitadel-root.entrypoints=web
      - traefik.http.routers.zitadel-root.rule=Host(`auth.${DOMAIN}`) && Path(`/`)
      - traefik.http.routers.zitadel-root.priority=20
      - traefik.http.routers.zitadel-root.middlewares=zitadel-root,public@file
      - traefik.http.routers.zitadel-root.service=zitadel-ui
      - traefik.http.services.zitadel-ui.loadbalancer.server.port=3000
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      ZITADEL_SESSION_COOKIE_SECRET: ${ZITADEL_LOGIN_COOKIE_SECRET:?set ZITADEL_LOGIN_COOKIE_SECRET in .env}
      CUSTOM_REQUEST_HEADERS: Host:auth.${DOMAIN},X-Forwarded-Proto:${PUBLIC_SCHEME}
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    networks: [edge]
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs", "http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    depends_on:
      zitadel-api:
        condition: service_healthy

volumes:
  zitadel-bootstrap:

networks:
  edge:
    name: edge
    external: true
  data:
    name: data
    external: true
