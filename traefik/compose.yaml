services:
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.7.14}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-dashboard.entrypoints=traefik
      - traefik.http.routers.traefik-dashboard.rule=PathPrefix(`/`)
      - traefik.http.routers.traefik-dashboard.service=api@internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
    ports:
      - "127.0.0.1:${TRAEFIK_PORT:-80}:80"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    networks:
      edge:
        aliases: [auth.localhost]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 5

  whoami:
    image: traefik/whoami:${TRAEFIK_WHOAMI_VERSION:-v1.10.3}
    profiles: [tools]
    networks: [edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.entrypoints=web
      - traefik.http.routers.whoami.rule=Host(`whoami.${DOMAIN:?set DOMAIN in .env}`)
      - traefik.http.services.whoami.loadbalancer.server.port=80

networks:
  edge:
    name: edge
    external: true
